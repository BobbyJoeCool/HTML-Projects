<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Robert Breutzmann HTML-CSS-JavaScript Projects</title>
</head>
<body>
<main>
    <h1>Cribbage Scoring App</h1>

    <h2>Instructions:</h2>
    <ul>
        <li>Select the 4 cards for your hand.</li>
        <li>Select the card for the "cut" card.</li>
        <li>Click "Score" to see the score.</li>
        <li>This will fill your hand FIRST, then the cut card.</li>
        <li>Crib scoring currently not supported.</li>
        <li>Click RESET to reset cards and score.</li>
    </ul>

<div id="hand">
    <div class="card-slot"></div>
    <div class="card-slot"></div>
    <div class="card-slot"></div>
    <div class="card-slot"></div>
</div>

<div id="cut-card">
    <div class="card-slot"></div>
</div>

<button type="button" id="reset-button" onClick="reset()">Reset</button>

<hr>

<div id="score">
    <p id="show-score">Score:</p>
</div>

<button type="button" id="score-button" onClick="scoreHand()">Score</button>

<hr>

<div id="deck"></div>

</main>
</body>
<script src="script.js"></script>
</html>
